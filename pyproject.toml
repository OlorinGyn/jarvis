[project]
name = "jarvis"
version = "0.1.0"
description = "Vigilancia domestica com cameras Tapo: movimento, pessoas, gravacao e rostos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
jarvis = "jarvis.cameras:main"

[tool.uv]
link-mode = "copy"
python-preference = "system"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
