[project]
name = "jarvis"
version = "0.1.0"
description = "Vigilancia domestica com cameras Tapo: movimento, pessoas, gravacao e rostos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
jarvis = "jarvis.cameras:main"

[tool.uv]
link-mode = "copy"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
