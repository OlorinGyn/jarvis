<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S. — Gravações</title>
  <link rel="icon" href="/icone.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <img src="/icone.png" alt="" class="logo">
    <div>
      <h1>J.A.R.V.I.S.</h1>
      <p class="subtitle">Gravações</p>
    </div>
  </header>

  <nav class="toolbar">
    <button id="anterior" title="Dia anterior com gravação">◀</button>
    <input type="date" id="dia">
    <button id="proximo" title="Próximo dia com gravação">▶</button>
    <button id="hoje">Hoje</button>
    <span id="resumo"></span>
  </nav>

  <main id="eventos"></main>

  <template id="cartao">
    <article class="cartao">
      <div class="foto"><img alt="" loading="lazy"></div>
      <div class="legenda">
        <div class="linha">
          <span class="hora"></span>
          <span class="camera"></span>
        </div>
        <div class="linha">
          <span class="rotulos"></span>
          <span class="duracao"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
