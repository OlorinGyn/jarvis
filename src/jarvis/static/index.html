<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S.</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <img src="/icon.png" alt="" class="logo">
    <h1>J.A.R.V.I.S.</h1>
    <nav class="tabs">
      <a href="#live" data-tab="live">Live</a>
      <a href="#recordings" data-tab="recordings">Recordings</a>
    </nav>
    <span id="connection" hidden>No connection to J.A.R.V.I.S.</span>
    <span id="version" title="Running version"></span>
  </header>

  <section id="live" class="tab">
    <div id="cameras"></div>
  </section>

  <section id="recordings" class="tab">
    <nav class="toolbar">
      <button id="previous" title="Previous day with recordings">◀</button>
      <input type="date" id="day">
      <button id="next" title="Next day with recordings">▶</button>
      <button id="today">Today</button>
      <span id="summary"></span>
    </nav>
    <main id="events"></main>
  </section>

  <template id="card">
    <article class="card">
      <div class="photo"><img alt="" loading="lazy"></div>
      <div class="caption">
        <div class="row">
          <span class="time"></span>
          <span class="camera"></span>
        </div>
        <div class="row">
          <span class="labels"></span>
          <span class="duration"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
